spring.application.name=ats-reviewer-backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SUPABASE_DB_URL:}
spring.datasource.driver-class-name=org.postgresql.Driver

app.auth.jwt-secret=${JWT_SECRET:}
app.auth.access-token-ttl=${ACCESS_TOKEN_TTL_MIN:15}m
app.auth.refresh-token-ttl=${REFRESH_TOKEN_TTL_DAYS:14}d
app.guest.ttl=${GUEST_TTL_HOURS:24}h
app.guest.turnstile-secret=${TURNSTILE_SECRET:}
app.guest.captcha-enabled=${TURNSTILE_ENABLED:true}
app.guest.cookie-secure=${GUEST_COOKIE_SECURE:false}
app.guest.ip-hash-salt=${IP_HASH_SALT:}
