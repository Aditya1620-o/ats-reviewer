spring.application.name=ats-reviewer-backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SUPABASE_DB_URL:}
spring.datasource.driver-class-name=org.postgresql.Driver

app.auth.jwt-secret=${JWT_SECRET:}
app.auth.google-client-id=${GOOGLE_CLIENT_ID:}
app.auth.access-token-ttl=${ACCESS_TOKEN_TTL_MIN:15}m
app.auth.refresh-token-ttl=${REFRESH_TOKEN_TTL_DAYS:14}d
app.guest.ttl=${GUEST_TTL_HOURS:24}h
app.guest.turnstile-secret=${TURNSTILE_SECRET:}
app.guest.captcha-enabled=${TURNSTILE_ENABLED:true}
app.guest.cookie-secure=${GUEST_COOKIE_SECURE:false}
app.guest.ip-hash-salt=${IP_HASH_SALT:}
app.consent.notice-version=${NOTICE_VERSION:2026-11-v1}
app.consent.subject-pepper=${CONSENT_SUBJECT_PEPPER:}
app.rate-limit.valkey-url=${VALKEY_URL:redis://localhost:6379}
app.storage.s3.endpoint=${S3_ENDPOINT:}
app.storage.s3.region=${S3_REGION:us-east-1}
app.storage.s3.bucket=${S3_BUCKET:ats-reviewer-resumes}
app.storage.s3.access-key=${S3_ACCESS_KEY:}
app.storage.s3.secret-key=${S3_SECRET_KEY:}
app.shared-report.ttl=${SHARED_REPORT_TTL:7d}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
